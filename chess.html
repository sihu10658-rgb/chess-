<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>체스 게임 vs AI</title>
    <!-- 체스 규칙 엔진 라이브러리 딱 하나만 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; text-align: center; background: #1e1e1e; color: #fff; margin-top: 20px; }
        #status { font-size: 18px; margin: 15px 0; color: #f1c40f; font-weight: bold; }
        
        #board {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            grid-template-rows: repeat(8, 60px);
            width: 480px;
            height: 480px;
            margin: 20px auto;
            border: 4px solid #444;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }
        .square {
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 42px; /* 기물 크기 조금 더 키움 */
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s; /* 호버 애니메이션 추가 */
        }
        .square:hover { filter: brightness(1.1); }
        .light { background-color: #f0d9b5; }
        .dark { background-color: #b58863; }
        .selected { background-color: #7b61ff !important; }
        
        .btn { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #3498db; color: white; border: none; border-radius: 5px; font-weight: bold; }
        .btn:hover { background: #2980b9; }

        #promotion-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100;
        }
        .modal-content { background: #2c3e50; padding: 25px; border-radius: 12px; text-align: center; }
        .promo-btn { font-size: 28px; margin: 8px; padding: 10px 18px; cursor: pointer; background: #34495e; border: 2px solid #bdc3c7; border-radius: 8px; color: white; }
        .promo-btn:hover { background: #e67e22; }
    </style>
</head>
<body>

    <h1>⚔️ 체스 게임 vs AI</h1>
    <div id="status">백(당신)의 차례입니다.</div>
    <div id="board"></div>
    <br>
    <button class="btn" onclick="resetGame()">새 게임 시작</button>

    <!-- 프로모션 팝업창 -->
    <div id="promotion-modal">
        <div class="modal-content">
            <p>어떤 기물로 승진하시겠습니까?</p>
            <button class="promo-btn" onclick="selectPromotion('q')">♕ 퀸</button>
            <button class="promo-btn" onclick="selectPromotion('r')">♖ 룩</button>
            <button class="promo-btn" onclick="selectPromotion('b')">♗ 비숍</button>
            <button class="promo-btn" onclick="selectPromotion('n')">♘ 나이트</button>
        </div>
    </div>

    <script>
        const game = new Chess();
        let selectedSquare = null;
        let pendingMove = null;

        const pieceSymbols = {
            p: '♟', r: '♜', n: '♞', b: '♝', q: '♛', k: '♚',
            P: '♙', R: '♖', N: '♘', B: '♗', Q: '♕', K: '♔'
        };
        const pieceValues = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };

        // [최적화 1] 처음에만 DOM 요소를 생성하는 초기화 함수
        function initBoardUI() {
            const boardEl = document.getElementById("board");
            boardEl.innerHTML = ""; // 딱 한 번만 비움
            
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const squareEl = document.createElement("div");
                    const isLight = (r + c) % 2 === 0;
                    squareEl.className = `square ${isLight ? 'light' : 'dark'}`;
                    
                    const file = String.fromCharCode(97 + c);
                    const rank = 8 - r;
                    const squareId = file + rank;
                    
                    squareEl.id = `sq-${squareId}`; // 요소 업데이트를 위해 ID 부여
                    squareEl.dataset.square = squareId;
                    squareEl.addEventListener("click", () => handleSquareClick(squareId));
                    boardEl.appendChild(squareEl);
                }
            }
        }

        // [최적화 2] 기존 요소의 내용(텍스트, 클래스)만 변경하는 업데이트 함수
        function updateBoardUI() {
            const boardState = game.board();
            
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const file = String.fromCharCode(97 + c);
                    const rank = 8 - r;
                    const squareId = file + rank;
                    const squareEl = document.getElementById(`sq-${squareId}`);
                    
                    // 선택된 칸 하이라이트 처리
                    if (selectedSquare === squareId) {
                        squareEl.classList.add('selected');
                    } else {
                        squareEl.classList.remove('selected');
                    }

                    // 기물 유니코드 렌더링
                    const piece = boardState[r][c];
                    if (piece) {
                        const symbolKey = piece.color === 'w' ? piece.type.toUpperCase() : piece.type;
                        squareEl.textContent = pieceSymbols[symbolKey];
                    } else {
                        squareEl.textContent = "";
                    }
                }
            }
        }

        // [최적화 3] 클릭 UX 다듬기
        function handleSquareClick(squareId) {
            if (game.game_over() || game.turn() !== 'w') return;

            const pieceClicked = game.get(squareId);

            // 1. 아무것도 안 골랐을 때
            if (!selectedSquare) {
                if (pieceClicked && pieceClicked.color === 'w') {
                    selectedSquare = squareId; // 내 기물이면 선택
                    updateBoardUI();
                }
                return;
            }

            // 2. 이미 무언가 골랐을 때
            if (selectedSquare === squareId) {
                selectedSquare = null; // 같은 거 또 누르면 취소
                updateBoardUI();
                return;
            }

            if (pieceClicked && pieceClicked.color === 'w') {
                selectedSquare = squareId; // 내 다른 기물 누르면 선택 변경
                updateBoardUI();
                return;
            }

            // 3. 이동 시도 (목적지 클릭)
            const source = selectedSquare;
            const target = squareId;
            
            // 프로모션인지 확인
            const piece = game.get(source);
            const isPromotion = (piece && piece.type === 'p' && target[1] === '8');

            if (isPromotion) {
                // 가능한 이동인지 가짜로 둬봐서 검증
                const testMoves = game.moves({ verbose: true });
                const isValid = testMoves.some(m => m.from === source && m.to === target);
                
                if (isValid) {
                    pendingMove = { from: source, to: target };
                    document.getElementById("promotion-modal").style.display = "flex";
                }
                return;
            }

            // 일반 이동 처리
            const move = game.move({ from: source, to: target, promotion: 'q' });
            
            if (move !== null) { // 유효한 이동 성공!
                selectedSquare = null;
                updateBoardUI();
                checkGameState();
            } else {
                // 이동할 수 없는 곳을 누르면 선택 취소
                selectedSquare = null;
                updateBoardUI();
            }
        }

        function selectPromotion(pieceType) {
            document.getElementById("promotion-modal").style.display = "none";
            game.move({ from: pendingMove.from, to: pendingMove.to, promotion: pieceType });
            pendingMove = null;
            selectedSquare = null;
            updateBoardUI();
            checkGameState();
        }

        function checkGameState() {
            if (game.game_over()) {
                updateStatusText();
            } else if (game.turn() === 'b') {
                document.getElementById("status").textContent = "AI가 수를 고민 중입니다...";
                // 브라우저 렌더링(UI 업데이트)할 시간을 벌어주기 위해 setTimeout 사용
                window.setTimeout(makeEngineMove, 100); 
            }
        }

        function evaluateBoard(boardObj) {
            let total = 0;
            const boardState = boardObj.board();
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const piece = boardState[r][c];
                    if (piece) {
                        const val = pieceValues[piece.type];
                        total += (piece.color === 'w') ? val : -val;
                    }
                }
            }
            return total;
        }

        function minimax(gameObj, depth, alpha, beta, maximizing) {
            if (depth === 0 || gameObj.game_over()) {
                return [evaluateBoard(gameObj), null];
            }

            const legalMoves = gameObj.moves({ verbose: true });
            let bestMove = legalMoves[0];

            if (maximizing) {
                let maxEval = -Infinity;
                for (let i = 0; i < legalMoves.length; i++) {
                    gameObj.move(legalMoves[i]);
                    const eval = minimax(gameObj, depth - 1, alpha, beta, false)[0];
                    gameObj.undo();
                    if (eval > maxEval) { maxEval = eval; bestMove = legalMoves[i]; }
                    alpha = Math.max(alpha, eval);
                    if (beta <= alpha) break; // 가지치기
                }
                return [maxEval, bestMove];
            } else {
                let minEval = Infinity;
                for (let i = 0; i < legalMoves.length; i++) {
                    gameObj.move(legalMoves[i]);
                    const eval = minimax(gameObj, depth - 1, alpha, beta, true)[0];
                    gameObj.undo();
                    if (eval < minEval) { minEval = eval; bestMove = legalMoves[i]; }
                    beta = Math.min(beta, eval);
                    if (beta <= alpha) break;
                }
                return [minEval, bestMove];
            }
        }

        function makeEngineMove() {
            if (game.game_over()) return;
            
            // depth 2~3 설정 (3 이상은 브라우저 렉 유발 가능)
            const bestMove = minimax(game, 2, -Infinity, Infinity, false)[1];
            if (bestMove) game.move(bestMove);
            
            updateBoardUI();
            
            if (game.game_over()) {
                updateStatusText();
            } else {
                document.getElementById("status").textContent = "백(당신)의 차례입니다.";
            }
        }

        function updateStatusText() {
            let statusText = "게임 종료!";
            if (game.in_checkmate()) {
                statusText = game.turn() === 'w' ? "체크메이트! AI(흑)의 승리입니다 ㅠㅠ" : "체크메이트! 당신(백)의 승리입니다!! 🎉";
            } else if (game.in_draw()) {
                statusText = "무승부입니다! 🤝";
            }
            document.getElementById("status").textContent = statusText;
        }

        function resetGame() {
            game.reset();
            selectedSquare = null;
            pendingMove = null;
            updateBoardUI();
            document.getElementById("status").textContent = "백(당신)의 차례입니다.";
        }

        // --- 프로그램 최초 진입점 ---
        initBoardUI();   // 체스판 껍데기를 먼저 만들고
        updateBoardUI(); // 기물을 세팅
    </script>
</body>
</html>
